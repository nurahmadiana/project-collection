<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Web App</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/script.js" defer></script>
    <script src="https://cdn/jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
    <!-- Register Form -->
    <div class="login_form">
        <form class="form" id="form" onsubmit="submitForm()">
            <div class="title">
                Register
            </div>
            <span class="inputs">
                <span class="inputf">
                    <input type="text" class="input" id="sName" placeholder="Isi nama lengkap" required>
                    <span class="label">Nama Lengkap</span>
                </span>
                <span class="inputf">
                    <input type="text" class="input" id="sRoll" placeholder="Isi nomor kuis" required>
                    <span class="label">Nomor Kuis</span>
                </span>
                <span class="inputf">
                    <input type="email" class="input" id="sEmail" placeholder="Isi email anda" required>
                    <span class="label">Email</span>
                </span>
                <span class="inputf">
                    <input type="password" class="input" id="sPass" placeholder="Isi password anda" required>
                    <span class="label">Password</span>
                </span>
            </span>
            <button type="submit" class="btn">Register</button>
        </form>
    </div>
</body>

</html>
